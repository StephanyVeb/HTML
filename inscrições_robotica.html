<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpíada de Robótica - IFPR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffc2d1; /* Fundo rosa pastel */
            font-family: 'Unbounded', sans-serif;
            padding: 40px;
            margin: 0;
            text-align: center;
            position: relative; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-weight: 700;
            color: #fb6f92; /* Rosa escuro para o título */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
        }

        form {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
            background: rgba(255, 255, 255, 0.4);
            padding: 35px;
            border-radius: 20px;
            position: relative;
            z-index: 2;
            border: none;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 400;
            color: #8c2f46;
        }

        input, select, textarea {
            font-family: 'Unbounded', sans-serif;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #fff;
            margin-top: 5px;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .flex-1 { flex: 1; }

        .button-container {
            margin-top: 40px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .button {
            position: relative;
            display: inline-block;
        }

        .button a {
            color: white;
            font-family: 'Unbounded', sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            text-decoration: none;
            background-color: #ff8fab; /* Rosa botão */
            display: block;
            position: relative;
            padding: 15px 30px;
            box-shadow: inset 0 1px 0 #ffc2d1, 0 8px 0 #dd537a; 
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        /* Botão de limpar rosa um pouco mais suave */
        .button.reset a {
            background-color: #f795a7;
            box-shadow: inset 0 1px 0 #d66483, 0 8px 0 #fb6f92;
        }

        .button a:active {
            top: 6px;
            box-shadow: inset 0 1px 0 #ffc2d1, inset 0 -3px 0 #c9184a;
        }

        .bicho-fofo {
            position: absolute;
            top: 10%;
            right: 6%;
            width: 200px;
            height: auto;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <img src="img.html/rosa.png" alt="Mascote Rosa" class="bicho-fofo">

    <h1>Inscrição Robótica IFPR</h1>

    <form id="roboticaForm" action="#" method="post" enctype="multipart/form-data">
        
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail Institucional:</label>
        <input type="email" id="email" name="email" placeholder="@ifpr.edu.br" required>

        <div class="row">
            <div class="flex-1">
                <label for="curso">Curso:</label>
                <input type="text" id="curso" name="curso" required>
            </div>
            <div style="width: 120px;">
                <label for="serie">Série/Ano:</label>
                <input type="text" id="serie" name="serie" required>
            </div>
        </div>

        <label>Modalidade de Participação:</label>
        <div style="margin-top: 5px;">
            <input type="radio" name="modalidade" value="olimpiada" style="width:auto;"> Olimpíada
            <input type="radio" name="modalidade" value="projeto" style="width:auto; margin-left: 15px;"> Projeto
        </div>

        <div class="row">
            <div class="flex-1">
                <label for="equipe">Nome da Equipe:</label>
                <input type="text" id="equipe" name="equipe" required>
            </div>
            <div style="width: 150px;">
                <label for="qtd">Integrantes (1-5):</label>
                <input type="number" id="qtd" name="qtd" min="1" max="5" required>
            </div>
        </div>

        <label for="lista">Lista de Integrantes:</label>
        <textarea id="lista" name="lista" placeholder="Nome dos outros membros da equipe..."></textarea>

        <div style="margin-top: 15px;">
            <input type="checkbox" id="equip" name="equip" style="width:auto;">
            <label for="equip" style="display: inline;">Necessita de equipamentos especiais?</label>
        </div>

        <label for="proposta">Upload de proposta de projeto:</label>
        <input type="file" id="proposta" name="proposta">

        <div style="margin-top: 20px;">
            <input type="checkbox" id="regulamento" name="regulamento" required style="width:auto;">
            <label for="regulamento" style="display: inline;">Aceito o regulamento da Olimpíada</label>
        </div>

        <div class="button-container">
            <div class="button">
                <a href="#" onclick="document.getElementById('roboticaForm').submit(); return false;">Inscrever Equipe</a>
            </div>
            <div class="button reset">
                <a href="#" onclick="document.getElementById('roboticaForm').reset(); return false;">Limpar</a>
            </div>
        </div>
    </form>

</body>
</html>
