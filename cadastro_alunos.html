<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos - Plataforma de Cursos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #66aec0;
            font-family: 'Unbounded', sans-serif;
            padding: 40px;
            margin: 0;
            text-align: center;
            position: relative; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            position: relative;
            z-index: 2;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 400;
            color: white;
        }

        input {
            font-family: 'Unbounded', sans-serif;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
            margin-top: 5px;
        }

        .button-container {
            margin-top: 40px;
            text-align: center;
            /* alinhando pq me dá 3 tipo de piripaque essas coisas torta */
            display: flex;
            justify-content: center;
            gap: 20px; 
        }

        .button {
            position: relative;
            display: inline-block;
        }

        .button a {
            color: white;
            font-family: 'Unbounded', sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            text-decoration: none;
            background-color: #1b4965;
            display: block;
            position: relative;
            padding: 15px 30px;
            box-shadow: inset 0 1px 0 #62b6cb, 0 8px 0 #0b2535; 
            border-radius: 5px;
            cursor: pointer;
        }

        /* botão de reset que esqueci */
        .button.reset a {
            background-color: #4a7c92;
            box-shadow: inset 0 1px 0 #8ecae6, 0 8px 0 #2a4d5e;
        }

        .button a:active {
            top: 6px;
            box-shadow: inset 0 1px 0 #62b6cb, inset 0 -3px 0 #0b2535;
        }

        /* cinamorol sla como escreve */
        .bicho-fofo {
            position: absolute;
            top: 40%;
            right: 6%;
            width: 350px;
            height: auto;
            z-index: 1;
            transform: translateY(-50%) rotate(15deg); 
            pointer-events: none;
        }
    </style>
</head>
<body>
    <img src="img.html/cina2.png" alt="Bichinho Fofo" class="bicho-fofo">

    <h1>Cadastro de Novo Aluno</h1>

    <form id="cadastroForm" action="#" method="post">
        <div>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div>
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
        </div>

        <div>
            <label>Gênero:</label>
            <div style="margin-top: 10px; color: white;">
                <input type="radio" id="masculino" name="genero" value="masculino" style="width: auto;"> Masculino
                <input type="radio" id="feminino" name="genero" value="feminino" style="width: auto; margin-left: 15px;"> Feminino
            </div>
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div style="margin-top: 20px; color: white;">
            <input type="checkbox" id="termos" name="termos" required style="width: auto;">
            <label for="termos" style="display: inline;">Eu aceito os termos de uso</label>
        </div>

        <div class="button-container">
            <div class="button">
                <a href="#" onclick="document.getElementById('cadastroForm').submit(); return false;">Cadastrar</a>
            </div>

            <div class="button reset">
                <a href="#" onclick="document.getElementById('cadastroForm').reset(); return false;">Limpar</a>
            </div>
        </div>
    </form>

</body>
</html>
